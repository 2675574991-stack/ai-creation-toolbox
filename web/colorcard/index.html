<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色卡生成器</title>
<style>
  :root{
    --bg:#070b12; --panel:#0e1727; --panel-2:#111c2f;
    --line:rgba(126,156,210,.15); --line-2:rgba(126,156,210,.28);
    --text:#e8eef9; --muted:#8392ab; --muted-2:#5f6f89;
    --accent:#4f8cff; --accent-2:#8b5cf6; --ok:#35d39a; --danger:#ff6b7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 420px at 85% -20%,rgba(139,92,246,.10),transparent 65%),
      radial-gradient(800px 420px at -10% 0%,rgba(79,140,255,.10),transparent 65%),
      var(--bg);
    color:var(--text);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    font-size:13px;overflow:hidden;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#243351;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#334873;background-clip:content-box}
  input,textarea{user-select:text}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .app{height:100vh;display:flex;flex-direction:column;min-height:0}

  /* 头部 */
  .head{
    flex:0 0 auto;padding:17px 24px 15px;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(17,28,47,.72),rgba(9,15,26,.15));
  }
  .title-row{display:flex;align-items:center;gap:9px}
  .title{font-size:17px;font-weight:700;letter-spacing:.2px}
  .pill{
    font-size:10px;color:#9fd9c4;background:rgba(53,211,154,.08);
    border:1px solid rgba(53,211,154,.18);border-radius:20px;padding:2px 8px;
  }
  .sub{font-size:11.5px;color:var(--muted);line-height:1.5}
  .head .sub{margin-left:auto;text-align:right;max-width:52%}

  /* 主体 */
  .body{
    flex:1;min-height:0;display:grid;grid-template-columns:395px minmax(0,1fr);
    gap:20px;padding:20px 24px 22px;
  }
  .left{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
  .card{
    background:linear-gradient(180deg,var(--panel),rgba(14,23,39,.72));
    border:1px solid var(--line);border-radius:13px;padding:14px;
  }

  /* 拖放区 */
  .drop{
    position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;text-align:center;cursor:pointer;overflow:hidden;
    border:1.5px dashed rgba(126,156,210,.34);border-radius:13px;
    background:
      radial-gradient(300px 140px at 50% 0%,rgba(79,140,255,.13),transparent 70%),
      linear-gradient(180deg,#101b2e,#0c1524);
    transition:border-color .18s,background .18s,transform .18s;
    padding:20px 16px;
  }
  .drop:hover{border-color:rgba(79,140,255,.65);background:linear-gradient(180deg,#12203a,#0d1728)}
  .drop.drag{border-color:var(--accent);background:linear-gradient(180deg,#142644,#0e1a30);transform:scale(.995)}
  .drop.loaded{border-style:solid;border-color:rgba(53,211,154,.36)}
  .drop-ico{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:5px;
    background:rgba(79,140,255,.14);border:1px solid rgba(79,140,255,.3);color:#a9c8ff;
  }
  .drop-ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .drop-title{font-size:13px;font-weight:600;color:#dfe9fa}
  .drop-sub{font-size:10.5px;color:var(--muted-2);letter-spacing:.2px}
  .file-chip{
    display:none;align-items:center;gap:7px;margin-top:7px;max-width:100%;
    background:rgba(53,211,154,.09);border:1px solid rgba(53,211,154,.23);
    border-radius:20px;padding:3px 10px;font-size:10.5px;color:#a9e5d0;
  }
  .file-chip.show{display:flex}
  .file-chip span{max-width:245px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 提示词 */
  .field-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .field-title{font-size:12px;font-weight:600;color:#cfdcf1}
  .field-hint{margin-left:auto;font-size:10px;color:var(--muted-2)}
  textarea{
    width:100%;height:92px;resize:none;line-height:1.55;
    background:#0a1322;color:#d8e4f7;border:1px solid var(--line);border-radius:9px;
    padding:9px 10px;font:12px/1.55 "Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    outline:none;transition:border-color .16s,box-shadow .16s;
  }
  textarea:focus{border-color:rgba(79,140,255,.55);box-shadow:0 0 0 3px rgba(79,140,255,.09)}
  .note{font-size:10px;color:var(--muted-2);line-height:1.55;margin-top:7px}

  /* 操作 */
  .actions{display:flex;gap:9px}
  .btn{
    flex:1;height:38px;border-radius:9px;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#dbe6f8;
    transition:all .16s;letter-spacing:.2px;
  }
  .btn:hover{background:rgba(255,255,255,.06);border-color:rgba(126,156,210,.5)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.primary{
    background:linear-gradient(135deg,#3f7ff0,#5b6bf0 55%,#7c5cf6);
    border-color:rgba(120,150,255,.55);color:#fff;
    box-shadow:0 6px 18px rgba(63,127,240,.25);
  }
  .btn.primary:hover{filter:brightness(1.08);box-shadow:0 7px 22px rgba(63,127,240,.36)}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .status{font-size:10.5px;color:var(--muted-2);min-height:15px;line-height:1.5}
  .status.ok{color:#79d9b6}
  .status.err{color:#ff8b95}

  /* 预览 */
  .right{
    min-width:0;min-height:0;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--panel),rgba(12,20,34,.6));
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
  }
  .preview-head{
    flex:0 0 42px;display:flex;align-items:center;gap:8px;padding:0 15px;
    border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:#c9d6eb;
  }
  .preview-head .dims{margin-left:auto;font-size:10px;color:var(--muted-2);font-weight:400}
  .preview{
    flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:18px;
    background:
      linear-gradient(45deg,rgba(255,255,255,.014) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.014) 75%),
      linear-gradient(45deg,rgba(255,255,255,.014) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.014) 75%),
      #060a11;
    background-size:20px 20px;background-position:0 0,10px 10px;
  }
  #canvas{display:none;max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
  #canvas.show{display:block}
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:#394962;font-size:11.5px;text-align:center}
  .empty svg{width:36px;height:36px;stroke:#2c3b55;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

  .palette{
    flex:0 0 auto;display:flex;gap:0;border-top:1px solid var(--line);
    min-height:52px;background:rgba(8,14,24,.55);
  }
  .chip{
    flex:1;min-width:0;height:52px;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    border-right:1px solid rgba(0,0,0,.28);overflow:hidden;
  }
  .chip:last-child{border-right:0}
  .chip .hex{font-size:9.5px;font-family:Consolas,"SFMono-Regular",monospace;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.75);letter-spacing:.3px}
  .chip .pct{font-size:8.5px;color:rgba(255,255,255,.62);text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .chip.empty{background:#0c1422}

  @media (max-width:1040px){
    .body{grid-template-columns:335px minmax(0,1fr);gap:15px;padding:16px}
    .head .sub{display:none}
  }
  @media (max-width:820px){
    .body{grid-template-columns:1fr;overflow:auto}
    .right{min-height:420px}
  }
  /* 嵌入「AI 创作工具箱」时：标题由外壳承担 */
  html.embedded .title-row{display:none}
  html.embedded .head{padding:12px 22px}
  html.embedded .head > div .sub{margin-left:0;text-align:left;max-width:none}
</style>
<script>if (window.top !== window) document.documentElement.classList.add('embedded');</script>
</head>
<body>
<div class="app">
  <header class="head">
    <div>
      <div class="title-row">
        <div class="title">色卡生成器</div>
        <span class="pill">本地处理</span>
      </div>
      <div class="sub" style="margin-top:5px">从图片提取 10 个主色，生成可直接作为 AI 视频参考图的黑底色卡。</div>
    </div>
    <div class="sub">支持 JPG / PNG / WebP · 自动 EXIF 转正 · 透明区域不参与取色</div>
  </header>

  <main class="body">
    <section class="left">
      <div class="drop" id="drop">
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden>
        <div class="drop-ico">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        </div>
        <div class="drop-title">把图片拖到这里，或点击选择</div>
        <div class="drop-sub">JPG / PNG / WebP · 支持透明背景</div>
        <div class="file-chip" id="fileChip"><span id="fileName"></span></div>
      </div>

      <div class="card">
        <div class="field-head">
          <div class="field-title">风格提示词</div>
          <div class="field-hint">印在色块下方，可留空</div>
        </div>
        <textarea id="prompt" spellcheck="false"></textarea>
        <div class="note">留空时色卡不含任何文字，更适合直接作为参考图使用。</div>
      </div>

      <div class="actions">
        <button class="btn primary" id="gen">
          <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
          <span id="genLabel">生成色卡</span>
        </button>
        <button class="btn" id="save" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></svg>
          保存 PNG
        </button>
      </div>
      <div class="status" id="status">拖入图片开始 · 全部在本机完成</div>
    </section>

    <section class="right">
      <div class="preview-head">
        <span>色卡预览</span>
        <span class="dims" id="dims">1600 × —</span>
      </div>
      <div class="preview" id="preview">
        <div class="empty" id="empty">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 5"/><circle cx="8.2" cy="8.2" r="1.3"/></svg>
          <div>生成后的色卡会显示在这里</div>
        </div>
        <canvas id="canvas"></canvas>
      </div>
      <div class="palette" id="palette"></div>
    </section>
  </main>
</div>
<script src="colorcard.js"></script>
</body>
</html>
