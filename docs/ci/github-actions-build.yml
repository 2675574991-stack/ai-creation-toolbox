name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller pillow

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./scripts/fetch-webview2.ps1

      - name: Build AssetNest
        shell: pwsh
        run: ./scripts/build-assetnest.ps1

      - name: Build toolbox
        shell: pwsh
        run: ./build.ps1 -SkipAssetNest

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path 'dist/AI创作工具箱' -DestinationPath 'AI-Creation-Toolbox-win64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creation-Toolbox-win64
          path: AI-Creation-Toolbox-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Creation-Toolbox-win64.zip
          generate_release_notes: true
